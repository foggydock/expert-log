<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>有識者ログ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2331566b'/><text x='50' y='55' font-size='58' text-anchor='middle' dominant-baseline='central' fill='%23f4f6f7' font-family='sans-serif'>識</text></svg>">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f4f6f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="有識者ログ">
<style>
  :root{
    --bg:#f4f6f7; --surface:#ffffff; --ink:#26313a; --muted:#74838d;
    --line:#dfe6ea; --accent:#31566b; --accent-soft:#e6eef3;
    --ok:#1d7a55; --ok-soft:#e1f1ea; --danger:#a3402d;
    --ai:#8a6d2f; --ai-soft:#f6efdd;
    --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.7;
    padding-bottom:78px; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:640px;margin:0 auto;padding:16px}
  header.app{
    position:sticky;top:0;z-index:5;background:var(--bg);
    padding:14px 16px 10px;border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px
  }
  header.app h1{font-size:19px;margin:0;font-weight:600;letter-spacing:.02em}
  header.app .sub{font-size:12px;color:var(--muted)}
  header.app .account-summary{flex-basis:100%;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
  header.app .account-retry{font:inherit;color:var(--accent);background:none;border:0;text-decoration:underline;cursor:pointer;padding:0 4px}

  .view{display:none}
  .view.active{display:block}

  textarea{
    width:100%;min-height:170px;padding:14px;border:1px solid var(--line);
    border-radius:var(--radius);font-size:16px;font-family:inherit;line-height:1.7;
    background:var(--surface);resize:vertical;color:var(--ink)
  }
  textarea:focus,input:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;gap:8px;align-items:center;margin-top:10px}
  input.txt{
    flex:1;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
    font-size:16px;background:var(--surface);font-family:inherit;color:var(--ink)
  }
  .label{font-size:13px;color:var(--muted);margin:4px 2px}
  button.primary{
    width:100%;margin-top:12px;padding:15px;border:none;border-radius:var(--radius);
    background:var(--accent);color:#fff;font-size:17px;font-weight:600;
    font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px
  }
  button.primary:disabled{opacity:.55}
  .row button.primary{margin-top:0}
  button.primary.secondary{background:var(--surface);color:var(--accent);border:1px solid var(--line)}
  .result{
    margin-top:14px;padding:13px 14px;border-radius:12px;background:var(--ok-soft);
    color:var(--ok);font-size:14px;display:none;border:1px solid #cfe8dd;white-space:pre-wrap
  }
  .result.err{background:#f7e7e3;color:var(--danger);border-color:#eccabf}
  .result.show{display:block}
  .result .result-link{color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer}
  .preview{margin-top:14px;display:none}
  .preview.show{display:block}
  .preview .pv-title{font-size:14px;font-weight:600;margin-bottom:10px}
  .pv-person{border-bottom:1px dashed var(--line);padding:10px 0}
  .pv-person:last-child{border-bottom:none}
  .pv-person-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;cursor:pointer}
  .pv-person-name{font-weight:600;font-size:15px}
  .pv-person-meta{font-size:12px;color:var(--muted)}
  .pv-badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
  .pv-badge.new{background:var(--ok-soft);color:var(--ok)}
  .pv-badge.warn{background:#f7e7e3;color:var(--danger);white-space:normal}
  .pv-stmts{margin:8px 0 0 24px;display:flex;flex-direction:column;gap:6px}
  .pv-stmt{display:flex;align-items:flex-start;gap:8px;font-size:13px;cursor:pointer;color:var(--ink)}
  .pv-stmt input{margin-top:3px}
  .pv-person.off .pv-stmts,.pv-person.off .pv-person-name,.pv-person.off .pv-person-meta,.pv-person.off .pv-badge{opacity:.4}
  .spinner{
    width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);
    border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 一覧 */
  .searchbar{display:flex;gap:8px;margin-bottom:10px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
  .chip{
    flex:0 0 auto;padding:6px 12px;border:1px solid var(--line);border-radius:999px;
    background:var(--surface);font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap
  }
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .list-mode{display:flex;gap:6px;margin:2px 0 12px}
  .list-mode button{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);font:600 13px inherit;cursor:pointer}
  .list-mode button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .list-summary{font-size:13px;color:var(--muted);margin:0 2px 10px}
  .list-summary strong{color:var(--ink);font-size:15px}
  .filter-label{font-size:12px;color:var(--muted);margin:2px 2px 3px}
  .genre-section{margin:18px 0 22px}
  .genre-section:first-child{margin-top:4px}
  .genre-heading{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px;color:var(--ink);font-size:15px;font-weight:600}
  .genre-heading .count{font-size:12px;color:var(--muted);font-weight:400}
  .genre-section .card{margin-bottom:8px}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer
  }
  .card .nm{font-size:17px;font-weight:600}
  .card .card-head{display:flex;align-items:baseline;gap:9px}
  .card .photo-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:0 0 auto;border:1px solid var(--line)}
  .card .no{flex:0 0 auto;color:var(--accent);font-size:12px;font-weight:600}
  .card .nm .rd{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
  .card .mt{font-size:13px;color:var(--muted);margin-top:2px}
  .card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tag{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
  .tag.cnt{background:#eef1f2;color:var(--muted)}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:34px 10px}

  /* 振り返りスポットライト */
  .spotlight{cursor:pointer}
  .spotlight h3{display:flex;align-items:center;justify-content:space-between}
  .sp-person{display:flex;align-items:center;gap:10px}
  .sp-photo{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:0 0 auto;border:1px solid var(--line)}
  .sp-name{font-size:16px;font-weight:600}
  .sp-number{color:var(--accent);font-size:12px;font-weight:600;margin-right:8px}
  .sp-name .rd{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
  .sp-meta{font-size:12px;color:var(--muted);margin-top:2px}
  .sp-quote{margin-top:10px;font-size:14px;line-height:1.7;padding:11px 13px;background:var(--accent-soft);border-radius:10px;color:var(--ink)}
  .btn-sm{border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:999px;padding:6px 12px;font-size:12px;font-family:inherit;cursor:pointer}

  /* 詳細 */
  .sheet{
    position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;display:none;
    padding-bottom:40px
  }
  .sheet.show{display:block}
  .sheet-head{
    position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
    padding:12px 16px;display:flex;align-items:center;gap:10px
  }
  .sheet-head button{
    border:1px solid var(--line);background:var(--surface);color:var(--accent);
    border-radius:10px;padding:8px 12px;font-size:14px;font-family:inherit;cursor:pointer
  }
  .sheet-head .t{font-size:16px;font-weight:600;flex:1}
  .box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
  .box h3{font-size:13px;color:var(--muted);margin:0 0 8px;font-weight:600}
  .field{display:flex;gap:10px;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .field:last-child{border-bottom:none}
  .field .k{color:var(--muted);flex:0 0 74px;font-size:13px}
  .field .v{flex:1}
  .profile-photo{display:block;width:112px;height:112px;object-fit:cover;border-radius:14px;border:1px solid var(--line);margin:2px 0 10px}
  .photo-link{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:14px;font-weight:600;text-decoration:none}
  .photo-link:hover{text-decoration:underline}
  .ai-mark{
    font-size:10px;padding:1px 6px;border-radius:999px;background:var(--ai-soft);
    color:var(--ai);margin-left:6px;vertical-align:2px;white-space:nowrap
  }
  .note{padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px;display:flex;gap:8px;align-items:flex-start}
  .note:last-child{border-bottom:none}
  .note .note-text{flex:1}
  .note .src{font-size:11px;color:var(--muted);margin-top:4px}
  .note .note-actions{flex:0 0 auto;display:flex;gap:6px}
  .note .note-actions button{border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:11px;padding:4px 8px;cursor:pointer}
  .note .btn-note-del{color:var(--danger)}
  .note .note-edit-ta{flex:1;min-height:70px;font-size:14px;font-family:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;resize:vertical}
  .del{color:var(--danger);border-color:#eccabf!important}

  /* 設定 */
  .set-row{margin-bottom:18px}
  .saved{font-size:12px;color:var(--ok);opacity:0;transition:opacity .2s}
  .saved.show{opacity:1}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}

  /* タブ */
  nav.tabs{
    position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--surface);
    border-top:1px solid var(--line);display:flex;
    padding-bottom:env(safe-area-inset-bottom)
  }
  nav.tabs button{
    flex:1;padding:11px 4px 9px;border:none;background:none;color:var(--muted);
    font-size:11px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px
  }
  nav.tabs button .ic{font-size:19px;line-height:1}
  nav.tabs button.on{color:var(--accent);font-weight:600}

  /* ログイン */
  #auth{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
  #auth.hide{display:none}
  #auth .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;width:100%;max-width:360px}
  #auth h2{margin:0 0 6px;font-size:18px}
  #auth p.sub{margin:0 0 16px;font-size:13px;color:var(--muted)}
  #auth input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin-bottom:10px;font-family:inherit}
  #auth .btns{display:flex;gap:8px;margin-top:4px}
  #auth .btns button{flex:1;padding:12px;border-radius:10px;font-size:15px;font-family:inherit;cursor:pointer}
  #au-login{border:none;background:var(--accent);color:#fff}
  #au-signup{border:1px solid var(--line);background:var(--surface);color:var(--accent)}
  #au-msg{font-size:13px;margin-top:12px;color:var(--danger);line-height:1.6}
  #au-msg.ok{color:var(--ok)}
</style>
</head>
<body>

<div id="auth"><div class="panel">
  <h2>有識者ログ</h2>
  <p class="sub">自分のデータを見るのでログインが必要です。</p>
  <form id="au-form">
    <input id="au-email" type="email" placeholder="メールアドレス" autocomplete="username">
    <input id="au-pass" type="password" placeholder="パスワード" autocomplete="current-password">
    <div class="btns">
      <button id="au-login" type="submit">ログイン</button>
      <button id="au-signup" type="button">新規登録</button>
    </div>
  </form>
  <div id="au-msg"></div>
</div></div>

<header class="app">
  <h1>有識者ログ</h1>
  <span class="sub">聞いた人を、貯める</span>
  <div class="account-summary"><span id="account-summary" aria-live="polite"></span><button class="account-retry" id="account-retry" type="button" hidden>人数を再確認</button></div>
</header>

<!-- ========== 記録 ========== -->
<section class="view active" id="v-record"><div class="wrap">
  <div class="label">文字起こし・記事などを、そのまま貼ってください</div>
  <textarea id="raw" placeholder="ポッドキャストの文字起こしや、記事の本文を貼り付け"></textarea>

  <button class="primary" id="btn-go"><span id="btn-label">この文章から人物を取り出す</span></button>

  <div class="box spotlight" id="spotlight" style="display:none">
    <h3>ふと思い出す<button class="btn-sm" id="sp-shuffle">🔀 別の人を見る</button></h3>
    <div id="sp-body"></div>
  </div>
  <div class="result" id="result"></div>
  <div class="box preview" id="preview"></div>
</div></section>

<!-- ========== 一覧 ========== -->
<section class="view" id="v-list"><div class="wrap">
  <div class="searchbar">
    <input class="txt" id="q" placeholder="名前・肩書・専門・発言で検索">
  </div>
  <div class="list-mode" role="group" aria-label="一覧の表示方法">
    <button type="button" class="on" data-list-mode="recent">新着順</button>
    <button type="button" data-list-mode="genre">ジャンル別</button>
  </div>
  <div class="list-summary" id="list-summary" aria-live="polite"></div>
  <div class="filter-label">専門・タグで絞り込む</div>
  <div class="chips" id="field-chips"></div>
  <div id="list"></div>
</div></section>

<!-- ========== 設定 ========== -->
<section class="view" id="v-settings"><div class="wrap">
  <div class="set-row">
    <div class="label">Gemini APIキー</div>
    <input class="txt" id="gkey" type="password" placeholder="AIza...">
    <div class="row"><button class="primary" id="btn-savekey">保存する</button></div>
    <span class="saved" id="gsaved">保存しました</span>
    <div class="hint">キーはこの端末の中だけに保存されます。スマホとPCで別々に入れてください。</div>
  </div>
  <div class="set-row">
    <div class="label">PCで開く</div>
    <div class="hint">このURLをPCのブラウザで開き、同じメールアドレスでログインすると、スマホと同じ人物・発言が見られます。</div>
    <div class="row">
      <input class="txt" id="share-url" readonly value="https://expert-log.pages.dev/">
      <button class="primary" id="btn-copy-url" style="width:auto;padding:11px 16px;white-space:nowrap">コピー</button>
    </div>
    <span class="saved" id="url-copied">コピーしました</span>
  </div>
  <div class="set-row">
    <div class="label">保存済みの発言を整形</div>
    <div class="hint">これまでに保存した発言を、話し言葉から整った書き言葉へ一括で整え直します（元の文章は上書きされます）。</div>
    <button class="primary secondary" id="btn-cleanup">発言を整形する</button>
    <div class="result" id="cleanup-result"></div>
  </div>
  <div class="set-row">
    <div class="label">アカウント</div>
    <div id="who" class="hint" style="margin-bottom:8px"></div>
    <button class="primary secondary" id="btn-logout" style="color:var(--danger)">ログアウト</button>
  </div>
</div></section>

<!-- ========== 人物詳細 ========== -->
<div class="sheet" id="sheet">
  <div class="sheet-head">
    <button id="sh-back">← 戻る</button>
    <span class="t" id="sh-title"></span>
    <button id="sh-del" class="del">削除</button>
  </div>
  <div class="wrap" id="sh-body"></div>
</div>

<nav class="tabs">
  <button data-view="record" class="on"><span class="ic">✍️</span>記録</button>
  <button data-view="list"><span class="ic">👤</span>一覧</button>
  <button data-view="settings"><span class="ic">⚙️</span>設定</button>
</nav>

<!-- 版を固定し integrity で改ざんを検知する（版を上げるときは integrity も計算し直す） -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js" integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp" crossorigin="anonymous"></script>
<script>
try {
const SUPABASE_URL = 'https://icxbyltorjpfexmwxzga.supabase.co';
const SUPABASE_KEY = 'sb_publishable_6qgfCo_xbhbjb3Lr__j-Yg_Y7Zk2yWH';
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const GEMINI_MODEL = 'gemini-2.5-flash';
// 長い文字起こしでも通常は待てる一方、通信が止まったまま操作不能にならない上限。
const GEMINI_REQUEST_TIMEOUT_MS = 120000;

const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => (s||'').trim();
// 画面の data-id は文字列、DBのIDは数値のこともあるため、型をそろえて比べる
const sameId = (a, b) => String(a) === String(b);
function safeHttpUrl(value){
  try{
    const url = new URL(norm(value));
    return /^https?:$/.test(url.protocol) ? url.href : '';
  }catch(_e){ return ''; }
}
function isDirectImageUrl(value){
  return /\.(?:avif|gif|jpe?g|png|webp)(?:[?#]|$)/i.test(value||'');
}
// 専門・AI補足項目は「a,b,c」の形でDBに入っている
const csv = s => norm(s).split(',').filter(Boolean);
function flash(el){ el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1800); }
const errMsg = e => (e._label ? e._label+'に失敗しました：' : 'うまくいきませんでした：') + e.message;
let currentUid = null;
let accountCountRequestId = 0;
let accountEmail = '';
function showAccountSummary(countText){
  $('#account-summary').textContent = `ログイン中：${accountEmail}　｜　登録済み：${countText}`;
}
async function refreshAccountCount(){
  const uid = currentUid;
  if(!uid) return;
  const requestId = ++accountCountRequestId;
  $('#account-retry').hidden = true;
  showAccountSummary('確認中…');
  try{
    const { count, error } = await withTimeout(supa.from('exp_people').select('id', { count:'exact', head:true }), 6000, '登録人数の取得');
    if(error) throw error;
    if(count == null) throw new Error('人数を取得できませんでした');
    if(uid === currentUid && requestId === accountCountRequestId) showAccountSummary(`${count}人`);
  }catch(e){
    if(uid === currentUid && requestId === accountCountRequestId){
      showAccountSummary('取得できませんでした');
      $('#account-retry').hidden = false;
    }
  }
}
$('#account-retry').onclick = refreshAccountCount;
let people = [];          // 一覧用にメモリへ持つ
let activeField = 'すべて';
let searchQuery = '';
let listMode = 'recent';

/* ---------- タブ切替 ---------- */
document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    const v = b.dataset.view;
    document.querySelectorAll('.view').forEach(s=>s.classList.remove('active'));
    $('#v-'+v).classList.add('active');
    if(v==='list') loadPeople();
  };
});

/* ---------- 設定 ---------- */
$('#gkey').value = localStorage.getItem('gemini_key') || '';
$('#au-email').value = localStorage.getItem('last_email') || '';
$('#btn-savekey').onclick = ()=>{
  localStorage.setItem('gemini_key', $('#gkey').value.trim());
  flash($('#gsaved'));
};

/* ---------- 通信まわり（歴史ログと同じ作り） ---------- */
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const isNetErr = m => /load failed|failed to fetch|networkerror|network error|fetch|timeout|タイムアウト/i.test(m||'');

function withTimeout(promise, ms, label){
  let timer;
  const timeout = new Promise((_, reject)=>{
    timer = setTimeout(()=>reject(new Error(`${label}がタイムアウトしました`)), ms);
  });
  return Promise.race([Promise.resolve(promise), timeout]).finally(()=>clearTimeout(timer));
}

async function dbRetry(fn, label){
  let lastErr;
  for(let a=0;a<3;a++){
    if(a>0){ console.warn(`${label}を再試行します (${a+1}/3)`); await sleep(800*a); }
    let result;
    try{ result = await withTimeout(fn(), 6000, label); }
    catch(e){
      lastErr = e;
      if(!isNetErr(e.message)) break;
      continue;
    }
    const { data, error } = result;
    if(!error) return data;
    lastErr = error;
    if(!isNetErr(error.message)) break;
  }
  const e = new Error((lastErr && lastErr.message) || '失敗'); e._label = label; throw e;
}

// Supabase は1回の取得を最大1000行で打ち切るため、1000行ずつ続きを取り寄せて全件にする。
// build は毎回新しい問い合わせを作る関数。ページの境目がずれないよう、並び順を必ず固定しておく。
const PAGE_SIZE = 1000;
async function selectAll(build, label){
  const all = [];
  for(let from = 0; ; from += PAGE_SIZE){
    const rows = await dbRetry(()=>build().range(from, from + PAGE_SIZE - 1), label);
    all.push(...rows);
    if(rows.length < PAGE_SIZE) return all;
  }
}

// 保存系はタイムアウト後に自動再試行しない。サーバー側では処理が完了していても
// ブラウザだけが応答を受け取れないことがあり、再送すると同じ取り込みを重複保存するため。
async function dbWrite(fn, label){
  try{
    const { data, error } = await withTimeout(fn(), 6000, label);
    if(error) throw error;
    return data;
  }catch(err){
    const e = new Error((err && err.message) || '失敗');
    e._label = label;
    e._uncertain = isNetErr(e.message);
    throw e;
  }
}

// AIに問い合わせ、返事のJSONを読み取って返す。onRetry は再試行のたびに呼ばれる（表示の更新用）。
async function geminiJson(prompt, responseSchema, onRetry){
  const key = localStorage.getItem('gemini_key');
  if(!key) throw new Error('NO_KEY');
  // キーはURLに含めず、ヘッダーで送る
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;
  const gen = { responseMimeType:'application/json', temperature:0.2 };
  if(responseSchema) gen.responseSchema = responseSchema;
  const body = JSON.stringify({ contents:[{parts:[{text:prompt}]}], generationConfig: gen });
  let lastErr, res = null;
  for(let attempt=0; attempt<4 && !res; attempt++){
    if(attempt>0){ if(onRetry) onRetry(); await sleep(900*Math.pow(2,attempt-1)); }
    let r;
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), GEMINI_REQUEST_TIMEOUT_MS);
    try{
      r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body,signal:controller.signal});
    }catch(e){
      if(controller.signal.aborted) throw new Error('AIの応答がタイムアウトしました。もう一度お試しください。');
      lastErr=e;
      continue;
    }finally{
      clearTimeout(timer);
    }
    if(r.ok){ res = r; break; }
    const t = await r.text().catch(()=>'');
    lastErr = new Error('GEMINI '+r.status+': '+t.slice(0,160));
    if(![429,500,503].includes(r.status)) throw lastErr;
  }
  if(!res) throw lastErr;
  const json = await res.json();
  const text = json?.candidates?.[0]?.content?.parts?.[0]?.text;
  if(!text) throw new Error('AIの返事が空でした');
  try{ return JSON.parse(text); }
  catch(_e){ throw new Error('AIの返事を読み取れませんでした'); }
}

/* ---------- 抽出 ---------- */
// 本文から読み取れたことと、AIが自分の知識で補ったことを必ず分けて返させる。
// （見本のNotionでは両方が混ざっていて、あとから真偽を確かめられなかった）
const PERSON_SCHEMA = {
  type:'object',
  properties:{ people:{ type:'array', items:{
    type:'object',
    properties:{
      name:{type:'string'},
      reading:{type:'string'},
      title:{type:'string'},
      affiliation:{type:'string'},
      birth_year:{type:'integer',nullable:true},
      age:{type:'integer',nullable:true},
      fields:{type:'array',items:{type:'string'}},
      profile:{type:'string'},
      ai_filled:{type:'array',items:{type:'string'}},
      statements:{type:'array',items:{type:'string'}}
    },
    required:['name']
  } } },
  required:['people']
};

function buildPrompt(rawText, existing){
  const existingList = existing.length
    ? existing.map(p=>`- ${p.name}${p.title?'（'+p.title+'）':''}`).join('\n')
    : '（まだ登録がありません）';
  return `あなたは「有識者リスト」の整理係です。下の【テキスト】は、ポッドキャストの文字起こしや記事の本文です。
ここに出てくる「語っている人・紹介されている人」を人物として取り出してください。

【すでに登録済みの人物】同じ人ならこの名前を一字一句そのまま使い、重複を作らないこと。
${existingList}

【取り出す人の基準】
- その分野について語っている人、専門家として紹介されている人、取材されている人。
- 進行役・アナウンサー・単に名前が出ただけの人（言及された第三者、歴史上の人物など）は取り出さない。
- 誰の発言か特定できない部分は、無理に人物に結びつけない。

【各項目の埋め方】
- name: 人物の氏名。読み仮名が本文にあれば reading に。
- title: 肩書（例：経済学者、起業家）。affiliation: 所属（例：同志社大学、株式会社COTEN）。
- birth_year: 生まれた年（西暦）。age: 年齢。どちらも分からなければ null。推測しないこと。
- fields: 専門分野を短い語で2〜4個（例：["ベーシックインカム","社会政策"]）。
- profile: 経歴・人物像を3〜5文で。
- statements: この人が【テキスト】の中で述べていた主張・意見を、1件1文で最大6件。
  内容は本文にある発言に忠実に、意味や主張を変えないこと。ただし文体は「、あの」「〜なんですよね」「えー」のような話し言葉・フィラー・言い淀みを取り除き、読んでそのまま趣旨が伝わる整った書き言葉（である調 or ですます調のどちらか一貫した文体）に整えて書くこと。本文に無い発言を作らないこと。
  文脈や相手の発言を知らないと意味が分からない相槌・相手への感想・雑談（例：「〜結構いきなり任せますね」のような相手の行動へのコメント）は含めないこと。その人自身の考え・主張・知見・経験として、単独で読んでも意味が伝わるものだけを残すこと。
- ai_filled: 【テキスト】には書かれておらず、あなた自身の知識で補った項目名だけを並べる。
  使える項目名は "title","affiliation","birth_year","age","fields","profile" のみ。
  本文から読み取れた項目は、ここに入れないこと。

分からない項目は空文字か null にしてください。埋めるために推測で書かないこと。
該当する人物が一人もいなければ people を空の配列にしてください。出力はJSONのみ。

【テキスト】
${rawText}`;
}

function showResult(msg, isErr, isHtml){
  const r = $('#result');
  if(isHtml) r.innerHTML = msg; else r.textContent = msg;
  r.classList.toggle('err', !!isErr);
  r.classList.add('show');
  if(isHtml){
    r.querySelectorAll('.result-link').forEach(el=>{
      el.onclick = ()=> openPerson(el.dataset.id);
    });
  }
}

let pending = null;   // 保存前プレビュー中のデータ

// 名前の比べ方：空白・中黒・全角半角の違いだけの名前は「似た名前」とみなす
const nameKey = s => norm(s).normalize('NFKC').replace(/[\s・･]/g, '');
function matchExisting(name, existing){
  if(existing.some(e => e.name === norm(name))) return { kind:'same' };
  const similar = existing.find(e => nameKey(e.name) === nameKey(name));
  return similar ? { kind:'similar', name: similar.name } : { kind:'new' };
}

$('#btn-go').onclick = async ()=>{
  const raw = norm($('#raw').value);
  if(!raw){ showResult('先に文章を貼り付けてください。', true); return; }
  if(!localStorage.getItem('gemini_key')){ showResult('先に「設定」でGemini APIキーを保存してください。', true); return; }

  const btn = $('#btn-go');
  const uid = currentUid;
  btn.disabled = true;
  $('#btn-label').innerHTML = '<span class="spinner"></span> 読み取り中…';
  $('#result').classList.remove('show');
  $('#preview').classList.remove('show');

  try{
    // 既存の人物名（重複を作らせないためAIに渡す）
    const existing = await selectAll(()=>supa.from('exp_people').select('name,title').order('id'), '人物リストの取得');
    const parsed = await geminiJson(buildPrompt(raw, existing), PERSON_SCHEMA,
      ()=>{ $('#btn-label').textContent = '混雑のため再試行中…'; });
    // 読み取り中にログアウト・アカウント切替があったら、前の利用者向けの結果は使わない
    if(uid !== currentUid) return;
    const found = (parsed.people||[]).filter(p=>norm(p.name));
    if(!found.length){ showResult('この文章からは人物を見つけられませんでした。', true); return; }

    pending = {
      raw,
      people: found.map(p => ({
        ...p,
        include: true,
        match: matchExisting(p.name, existing),
        statements: (p.statements||[]).map(norm).filter(Boolean).map(t => ({ text: t, include: true }))
      }))
    };
    renderPreview();
  }catch(e){
    if(uid !== currentUid) return;
    if(e.message === 'NO_KEY') showResult('設定でGemini APIキーを保存してください。', true);
    else showResult(errMsg(e), true);
  }finally{
    btn.disabled = false;
    $('#btn-label').textContent = 'この文章から人物を取り出す';
  }
};

/* ---------- 保存前プレビュー ---------- */
function renderPreview(){
  if(!pending) return;
  const body = pending.people.map((p, pi) => {
    const meta = [p.title, p.affiliation].filter(Boolean).join('／');
    const stmts = p.statements.length
      ? p.statements.map((s, si) => `
        <label class="pv-stmt">
          <input type="checkbox" data-pi="${pi}" data-si="${si}" class="pv-stmt-chk" ${s.include?'checked':''}>
          <span>${esc(s.text)}</span>
        </label>`).join('')
      : '<div class="hint" style="margin-left:2px">発言なし</div>';
    // 保存前に、すでに一覧にいる人か・表記ゆれで別人として増えそうな人かを見分けられるようにする
    const badge = p.match.kind === 'same' ? '<span class="pv-badge">登録済み</span>'
      : p.match.kind === 'similar' ? `<span class="pv-badge warn">似た名前「${esc(p.match.name)}」が登録済み</span>`
      : '<span class="pv-badge new">新規</span>';
    return `<div class="pv-person${p.include?'':' off'}" data-pi="${pi}">
      <label class="pv-person-head">
        <input type="checkbox" class="pv-person-chk" data-pi="${pi}" ${p.include?'checked':''}>
        <span class="pv-person-name">${esc(p.name)}</span>
        ${badge}
        ${meta?`<span class="pv-person-meta">${esc(meta)}</span>`:''}
      </label>
      <div class="pv-stmts">${stmts}</div>
    </div>`;
  }).join('');
  $('#preview').innerHTML = `<div class="pv-title">内容を確認してから保存してください（誤って混ざった発言はチェックを外せます）</div>
    ${body}
    <div class="row">
      <button class="primary" id="pv-save">この内容で保存する</button>
      <button class="primary secondary" id="pv-cancel">やめる</button>
    </div>`;
  $('#preview').classList.add('show');

  $('#preview').querySelectorAll('.pv-stmt-chk').forEach(el => {
    el.onchange = () => { pending.people[el.dataset.pi].statements[el.dataset.si].include = el.checked; };
  });
  $('#preview').querySelectorAll('.pv-person-chk').forEach(el => {
    el.onchange = () => { pending.people[el.dataset.pi].include = el.checked; renderPreview(); };
  });
  $('#pv-cancel').onclick = () => { pending = null; $('#preview').classList.remove('show'); $('#preview').innerHTML = ''; };
  $('#pv-save').onclick = savePending;
}

async function savePending(){
  if(!pending) return;
  const toSave = pending.people.filter(p => p.include);
  if(!toSave.length){ alert('保存する人物が選ばれていません。'); return; }

  // 保存中にチェックの付け外しや再読み取りをすると、保存ボタンが作り直されて
  // 二重に保存できてしまうため、保存が終わるまで操作をまとめて止める。
  const controls = [...$('#preview').querySelectorAll('input,button'), $('#btn-go')];
  controls.forEach(el => el.disabled = true);
  const btn = $('#pv-save');
  btn.textContent = '保存中…';
  const uid = currentUid;

  try{
    // DB関数の中で、出どころ・人物・発言を1つのトランザクションとして保存する。
    // 途中で失敗した場合は、どのテーブルにも中途半端なデータを残さない。
    const payloadPeople = toSave.map(p => ({
      name: norm(p.name),
      reading: norm(p.reading) || null,
      title: norm(p.title) || null,
      affiliation: norm(p.affiliation) || null,
      birth_year: p.birth_year ?? null,
      age: p.age ?? null,
      fields: (p.fields||[]).map(norm).filter(Boolean).join(',') || null,
      profile: norm(p.profile) || null,
      ai_filled: (p.ai_filled||[]).map(norm).filter(Boolean),
      statements: p.statements.filter(s => s.include).map(s => norm(s.text)).filter(Boolean)
    }));
    // 出どころの番組名・媒体・日付は入力欄を廃止したため、常に空で送る
    const saved = await dbWrite(()=>supa.rpc('exp_save_capture', {
      p_source: { title: null, media: null, aired_on: null, raw_text: pending.raw },
      p_people: payloadPeople
    }), 'まとめて保存');
    // 保存中にログアウト・アカウント切替があったら、保存した人物名を次の人の画面に出さない
    if(uid !== currentUid) return;

    const added = (saved.added||[]).map(x => x.name);
    const updated = (saved.updated||[]).map(x => x.name);
    const idByName = saved.ids || {};
    const nameLinks = names => names.map(n => `<span class="result-link" data-id="${idByName[n]}">${esc(n)}</span>`).join('、');
    const lines = [];
    if(added.length) lines.push('新しく追加：' + nameLinks(added));
    if(updated.length) lines.push('情報を足した人：' + nameLinks(updated));
    showResult(lines.join('\n'), false, true);
    $('#preview').classList.remove('show');
    $('#preview').innerHTML = '';
    $('#raw').value = '';
    people = [];
    pending = null;
    refreshSpotlight();
  }catch(e){
    if(uid !== currentUid) return;
    if(e._uncertain){
      alert('保存の完了を確認できませんでした。二重登録を防ぐため自動では再試行していません。先に「一覧」で保存済みか確認してください。');
    }else{
      alert(errMsg(e));
    }
    btn.textContent = 'この内容で保存する';
  }finally{
    controls.forEach(el => el.disabled = false);
  }
}

let peopleRequestId = 0;
async function loadPeople(){
  const uid = currentUid;
  // 続けて呼ばれたとき、先に始めた古い取得の結果で新しい一覧を上書きしない
  const requestId = ++peopleRequestId;
  // 表示中の一覧は取り直す間も残す（詳細から戻ったとき、スクロール位置が先頭へ飛ばないように）
  if(!people.length) $('#list').innerHTML = '<div class="empty">読み込み中…</div>';
  try{
    const rows = await selectAll(()=>supa.from('exp_people').select('*').order('updated_at',{ascending:false}).order('id'), '一覧の取得');
    // 発言は件数の表示と検索に使うので、本文ごと持ってくる
    const notes = await selectAll(()=>supa.from('exp_notes').select('person_id,text').order('id'), '発言の取得');
    // ログアウト・アカウント切替後に届いた、前の利用者向けの結果は使わない
    if(uid !== currentUid || requestId !== peopleRequestId) return;
    const map = {};
    notes.forEach(n => {
      const m = map[n.person_id] || (map[n.person_id] = {n:0, t:''});
      m.n++; m.t += ' ' + (n.text||'');
    });
    rows.forEach(p => { p._notes = map[p.id]?.n || 0; p._notetext = map[p.id]?.t || ''; });
    people = rows;
    renderChips();
    renderList();
  }catch(e){
    if(uid !== currentUid || requestId !== peopleRequestId) return;
    $('#list').innerHTML = '<div class="empty">読み込めませんでした：'+esc(e.message)+'</div>';
  }
}

function renderChips(){
  const c = {};
  people.forEach(p => csv(p.fields).forEach(f => c[f]=(c[f]||0)+1));
  const list = ['すべて', ...Object.keys(c).sort((a,b)=>c[b]-c[a])];
  if(!list.includes(activeField)) activeField = 'すべて';
  $('#field-chips').innerHTML = list.map(f =>
    `<span class="chip${f===activeField?' on':''}" data-f="${esc(f)}">${esc(f)}</span>`).join('');
  $('#field-chips').querySelectorAll('.chip').forEach(el=>{
    el.onclick = ()=>{ activeField = el.dataset.f; renderChips(); renderList(); };
  });
}

function renderList(){
  let rows = people;
  if(activeField !== 'すべて')
    rows = rows.filter(p => csv(p.fields).includes(activeField));
  if(searchQuery){
    const q = searchQuery.toLowerCase();
    rows = rows.filter(p => [p.name,p.reading,p.title,p.affiliation,p.fields,p.profile,p._notetext]
      .some(v => (v||'').toLowerCase().includes(q)));
  }
  const total = people.length;
  $('#list-summary').innerHTML = total
    ? `登録済み <strong>${total}人</strong>${rows.length !== total ? ` <span>（表示 ${rows.length}人）</span>` : ''}`
    : '登録済み <strong>0人</strong>';
  // No. はDBで人物ごとに固定した番号。並び順やジャンル別の表示位置では変わらない。
  if(!rows.length){
    $('#list').innerHTML = '<div class="empty">'+(people.length?'見つかりませんでした':'まだ誰もいません。「記録」から文章を貼ってください。')+'</div>';
    return;
  }
  const card = p=>{
    const meta = [p.title, p.affiliation].filter(Boolean).join('／');
    const age = p.age!=null ? p.age+'歳' : (p.birth_year!=null ? p.birth_year+'年生まれ' : '');
    const tags = csv(p.fields).map(f=>`<span class="tag">${esc(f)}</span>`).join('');
    const photoUrl = safeHttpUrl(p.photo_url);
    const avatar = isDirectImageUrl(photoUrl) ? `<img class="photo-avatar" src="${esc(photoUrl)}" alt="${esc(p.name)}の顔写真" loading="lazy" onerror="this.remove()">` : '';
    return `<div class="card" data-id="${p.id}">
      <div class="card-head"><span class="no">No. ${p.person_number}</span>${avatar}<div class="nm">${esc(p.name)}${p.reading?`<span class="rd">${esc(p.reading)}</span>`:''}</div></div>
      ${meta||age ? `<div class="mt">${esc([meta,age].filter(Boolean).join('・'))}</div>` : ''}
      <div class="tags">${tags}${p._notes?`<span class="tag cnt">発言 ${p._notes}</span>`:''}</div>
    </div>`;
  };
  if(listMode === 'genre'){
    const byField = {};
    const noField = [];
    rows.forEach(p=>{
      const fields = csv(p.fields);
      if(!fields.length) noField.push(p);
      fields.forEach(field=>{
        (byField[field] ||= []).push(p);
      });
    });
    const genres = Object.entries(byField).sort((a,b)=>b[1].length-a[1].length || a[0].localeCompare(b[0], 'ja'));
    // 専門が空の人もジャンル別で見失わないよう、最後にまとめて出す
    if(noField.length) genres.push(['ジャンル未設定', noField]);
    $('#list').innerHTML = genres.map(([field, members])=>`<section class="genre-section"><h2 class="genre-heading">${esc(field)}<span class="count">${members.length}人</span></h2>${members.map(card).join('')}</section>`).join('');
  }else{
    $('#list').innerHTML = rows.map(card).join('');
  }
  $('#list').querySelectorAll('.card').forEach(el=>{
    el.onclick = ()=> openPerson(el.dataset.id);
  });
}

let openId = null;
// 詳細で人物・発言を変えたら、閉じたときに「ふと思い出す」と一覧を取り直す
// （削除済みの人や古い文・肩書・発言数を出さない）

  openId = null;
  if(sheetDirty){
    sheetDirty = false;
    refreshSpotlight();
    // 一覧以外の画面にいるときは、次に一覧を開いたときに取り直される

$('#sh-back').onclick = closeSheet;
$('#sh-del').onclick = async ()=>{
  if(!openId) return;
  // 振り返りから開いた人は一覧の読み込み前だと people に居ないため、表示中の名前を使う
  if(!confirm(`「${$('#sh-title').textContent}」を発言ごと削除します。よろしいですか？`)) return;
  const btn = $('#sh-del');
  const deletedId = openId;
  btn.disabled = true;
  try{
    // exp_notes.person_id は ON DELETE CASCADE。親だけを一度削除すれば、
    // 発言を含めてDB内で原子的に削除される。
    await dbWrite(()=>supa.from('exp_people').delete().eq('id', deletedId), '人物の削除');
    // 取り直しが終わるまでの間も、消した人を一覧に出さない
    people = people.filter(x => !sameId(x.id, deletedId));
    renderList();
    sheetDirty = true;
    closeSheet();
  }catch(e){
    if(e._uncertain){
      // サーバーで削除済みか不明なため、画面を閉じて最新状態を取り直す。
      sheetDirty = true;
      closeSheet();
      alert('削除の完了を確認できませんでした。最新の一覧を確認してください。');
    }else{
      alert('削除できませんでした：'+e.message);
    }
  }finally{ btn.disabled = false; }
};

// 表示と編集フォームを丸ごと入れ替える（古い写真や注意書きが重複して残らないように）。
function showProfileView(p){

function wireProfileEdit(p){
  $('#btn-cancel-profile').onclick = ()=> showProfileView(p);
  $('#btn-save-profile').onclick = async ()=>{
    const btn = $('#btn-save-profile'); btn.disabled = true;
    // 全角数字も受け付ける。数字以外が混ざる入力を途中まで数値として保存しない。
    const numOrNull = v => {
      v = norm(v).normalize('NFKC');
      return v === '' ? null : (/^\d+$/.test(v) ? Number(v) : NaN);
    };
    const age = numOrNull($('#ed-age').value);
    const birthYear = numOrNull($('#ed-birth').value);
    if(Number.isNaN(age) || Number.isNaN(birthYear)){
      alert('年齢・生年は数字だけで入れてください。');
      btn.disabled = false;
      return;
    }
    const currentYear = new Date().getFullYear();
    if((age !== null && (age > 130)) || (birthYear !== null && (birthYear < 1000 || birthYear > currentYear))){
      alert(`年齢は130歳まで、生年は1000〜${currentYear}年で入れてください。`);
      btn.disabled = false;
      return;
    }
    const enteredPhotoUrl = norm($('#ed-photo-url').value);
    if(enteredPhotoUrl && !safeHttpUrl(enteredPhotoUrl)){
      alert('顔写真のURLは http:// または https:// で始まるものを入れてください。');
      btn.disabled = false;
      return;
    }
    const patch = {
      reading: norm($('#ed-reading').value) || null,
      title: norm($('#ed-title').value) || null,
      affiliation: norm($('#ed-affiliation').value) || null,
      age,
      birth_year: birthYear,
      fields: norm($('#ed-fields').value).split(/[、,，]/).map(norm).filter(Boolean).join(',') || null,
      photo_url: enteredPhotoUrl || null,
      profile: norm($('#ed-profile').value) || null,
      updated_at: new Date().toISOString()
    };
    // 手で直した項目は、もう「AIの推測のまま」ではないので補足マークを外す。
    // 変えていない項目のマークは残す（写真だけ直したときに、AIの推測が本文由来に見えないように）。
    const aiMarks = new Set(csv(p.ai_filled));
    ['title','affiliation','birth_year','age','fields','profile']
      .filter(k => String(patch[k] ?? '') !== String(p[k] ?? ''))
      .forEach(k => aiMarks.delete(k));
    patch.ai_filled = [...aiMarks].join(',') || null;
    try{
      await dbRetry(()=>supa.from('exp_people').update(patch).eq('id', p.id), 'プロフィールの更新');
      Object.assign(p, patch);
      const idx = people.findIndex(x=>x.id===p.id);
      if(idx>=0) people[idx] = Object.assign({}, people[idx], patch);
      sheetDirty = true;
      showProfileView(p);
    }catch(e){
      alert('保存できませんでした：'+e.message);
    }finally{
      btn.disabled = false;
    }
  };
}

async function openPerson(id){
  openId = id;
  let p = people.find(x=>sameId(x.id, id));
  if(!p){
    try{ p = await dbRetry(()=>supa.from('exp_people').select('*').eq('id',id).single(), '人物の取得'); }
    catch(e){
      if(openId === id){ openId = null; alert('人物を開けませんでした：'+e.message); }
      return;
    }
    // 取得を待つ間に閉じた・別の人を開いた場合は、古い結果で画面を上書きしない
    if(openId !== id) return;
  }
  $('#sh-title').textContent = p.name;
  $('#sh-body').innerHTML = '<div class="empty">読み込み中…</div>';
  $('#sheet').classList.add('show');
  // 詳細だけを先頭に戻す（後ろの一覧のスクロール位置は、戻ったときのために残す）
  $('#sheet').scrollTop = 0;

  let html = '<div id="profile-area"></div>';

  try{
    const notes = await dbRetry(()=>supa.from('exp_notes').select('*').eq('person_id',id).order('created_at',{ascending:false}), '発言の取得');
    const srcIds = [...new Set(notes.map(n=>n.source_id).filter(Boolean))];
    let srcMap = {};
    if(srcIds.length){
      const srcs = await dbRetry(()=>supa.from('exp_sources').select('id,title,media,aired_on').in('id', srcIds), '出どころの取得');
      srcs.forEach(s => srcMap[s.id] = s);
    }
    if(openId !== id) return;
    html += `<div class="box"><h3 id="notes-heading">この人が言っていたこと（${notes.length}）</h3>` +
      (notes.length ? notes.map(n=>{
        const s = srcMap[n.source_id];
        const label = s ? [s.title, s.media, s.aired_on].filter(Boolean).join('／') : '';
        return `<div class="note" data-note-id="${n.id}">
          <div class="note-text" data-text="${esc(n.text)}">${esc(n.text)}${label?`<div class="src">${esc(label)}</div>`:''}</div>

            <button class="btn-note-edit" data-note-id="${n.id}">編集</button>
            ${n.text_before_cleanup?`<button class="btn-note-revert" data-note-id="${n.id}">整形前に戻す</button>`:''}
            <button class="btn-note-del" data-note-id="${n.id}">削除</button>
          </div>
        </div>`;
      }).join('') : '<div class="hint">まだありません</div>') + `</div>`;
    $('#sh-body').innerHTML = html;
    showProfileView(p);
    $('#sh-body').querySelectorAll('.btn-note-del').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm('この発言を削除します。よろしいですか？')) return;
        btn.disabled = true;
        try{
          await dbRetry(()=>supa.from('exp_notes').delete().eq('id', btn.dataset.noteId), '発言の削除');
          btn.closest('.note').remove();
          sheetDirty = true;
          const left = $('#sh-body').querySelectorAll('.note').length;
          $('#notes-heading').textContent = `この人が言っていたこと（${left}）`;
          if(!left) $('#notes-heading').insertAdjacentHTML('afterend', '<div class="hint">まだありません</div>');
        }catch(e){
          alert('削除できませんでした：'+e.message);
          btn.disabled = false;
        }
      };
    });
    $('#sh-body').querySelectorAll('.btn-note-edit').forEach(btn=>{
      btn.onclick = ()=> startNoteEdit(btn.closest('.note'));
    });
    $('#sh-body').querySelectorAll('.btn-note-revert').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm('整形前の文章に戻します。よろしいですか？')) return;
        btn.disabled = true;
        try{
          const n = notes.find(x=>sameId(x.id, btn.dataset.noteId));
          await dbRetry(()=>supa.from('exp_notes').update({text:n.text_before_cleanup, text_before_cleanup:null}).eq('id', btn.dataset.noteId), '発言の復元');
          sheetDirty = true;
          openPerson(openId);
        }catch(e){
          alert('戻せませんでした：'+e.message);
          btn.disabled = false;
        }
      };
    });
  }catch(e){
    if(openId !== id) return;
    $('#sh-body').innerHTML = html + '<div class="empty">発言を読み込めませんでした：'+esc(e.message)+'</div>';
    showProfileView(p);
  }
}

function refreshSpotlight(){
  if(!currentUid) return;
  refreshAccountCount();
  // 取得中なら、その結果は変更前の内容なので、終わってからもう一度取り直す
  if(spotlightLoadPromise) spotlightLoadPromise.then(()=>{ if(currentUid) loadSpotlight(); });
  else loadSpotlight();
}

function loadSpotlight(){
  // onAuthStateChange と getSession が同時に発火しても取得を1本にまとめる。
  // 二重取得の片方だけ失敗し、成功済みの表示を後から隠す競合を防ぐ。
  if(spotlightLoadPromise) return spotlightLoadPromise;
  const requestId = ++spotlightRequestId;
  if(!spotlightLoaded){
    $('#sp-body').innerHTML = '<div class="hint">振り返りを読み込み中…</div>';
    $('#spotlight').style.display = 'block';
  }
  spotlightLoadPromise = (async ()=>{
    try{
      // No. は一覧と同じく、人物ごとに固定した番号を発言と一緒に取得する。
      const rows = await selectAll(()=>supa.from('exp_notes').select('id,text,person_id,last_reviewed_at,exp_people(name,reading,title,affiliation,person_number,photo_url)').order('id'), '振り返りの取得');
      // ログアウト・アカウント切替後に届いた、前の利用者向け通信結果は使わない。
      if(requestId !== spotlightRequestId || !currentUid) return;
      spotlightPool = (rows||[]).filter(r => r.exp_people && norm(r.text));
      spotlightLoaded = true;
      showRandomSpotlight();
    }catch(e){
      if(requestId !== spotlightRequestId || !currentUid) return;
      console.error('振り返りの取得に失敗', e);
      if(!spotlightLoaded){
        $('#sp-body').innerHTML = '<div class="hint">振り返りを読み込めませんでした。<button class="btn-sm" id="sp-retry">再試行</button></div>';
        $('#spotlight').style.display = 'block';
        $('#sp-retry').onclick = ev=>{ ev.stopPropagation(); loadSpotlight(); };
      }
    }finally{
      if(requestId === spotlightRequestId) spotlightLoadPromise = null;
    }
  })();
  return spotlightLoadPromise;
}

// 未振り返りは -Infinity（いちばん古い扱い）
const reviewedAt = note => note.last_reviewed_at ? new Date(note.last_reviewed_at).getTime() : -Infinity;

function showRandomSpotlight(){
  if(!spotlightPool.length){ $('#spotlight').style.display = 'none'; return; }
  // 発言ではなく人物単位で間隔を空ける。同じ人物の別の発言が未振り返りでも、
  // その人物を直近で表示していれば候補の後ろへ回す。
  const byPerson = new Map();
  spotlightPool.forEach(note => {
    const group = byPerson.get(note.person_id) || [];
    group.push(note);
    byPerson.set(note.person_id, group);
  });
  const sorted = [...byPerson.values()].map(notes => {
    // 人物の最終表示時刻は、その人の発言のうち最も新しい時刻を使う。
    const lastReviewed = Math.max(...notes.map(reviewedAt));
    return {notes, lastReviewed};
  }).sort((a,b)=>{
    if(a.lastReviewed !== b.lastReviewed) return a.lastReviewed - b.lastReviewed;
    return Math.random()-0.5; // 同点（未振り返り同士など）は都度ランダムに崩す
  });
  const poolSize = Math.max(1, Math.ceil(sorted.length*0.2));
  const pool = sorted.slice(0, poolSize);
  const person = pool[Math.floor(Math.random()*pool.length)];
  // 選ばれた人物の中では、まだ見ていない発言を優先する。
  const r = [...person.notes].sort((a,b)=> reviewedAt(a) - reviewedAt(b) || Math.random()-0.5)[0];
  const p = r.exp_people;
  const meta = [p.title, p.affiliation].filter(Boolean).join('／');
  const number = p.person_number;
  const photoUrl = safeHttpUrl(p.photo_url);
  const avatar = isDirectImageUrl(photoUrl) ? `<img class="sp-photo" src="${esc(photoUrl)}" alt="${esc(p.name)}の顔写真" loading="lazy" onerror="this.remove()">` : '';
  $('#sp-body').innerHTML = `<div class="sp-person">${avatar}<div><div class="sp-name">${number?`<span class="sp-number">No. ${number}</span>`:''}${esc(p.name)}${p.reading?`<span class="rd">${esc(p.reading)}</span>`:''}</div>
    ${meta?`<div class="sp-meta">${esc(meta)}</div>`:''}</div></div>
    <div class="sp-quote">「${esc(r.text)}」</div>
    <div class="row"><button class="btn-sm" id="sp-mark-read">読んだ</button><span class="hint" id="sp-read-status"></span></div>`;
  spotlightCurrentNote = r;
  $('#spotlight').dataset.pid = r.person_id;
  $('#spotlight').style.display = 'block';
  $('#sp-mark-read').onclick = ev=>{ ev.stopPropagation(); markReviewed(spotlightCurrentNote); };
}

async function markReviewed(r){
  if(!r) return;
  const btn = $('#sp-mark-read');
  const status = $('#sp-read-status');
  if(!btn || btn.disabled) return;
  btn.disabled = true;
  btn.textContent = '記録中…';
  const now = new Date().toISOString();
  try{
    await dbWrite(()=>supa.from('exp_notes').update({last_reviewed_at:now}).eq('person_id', r.person_id), '振り返り済みの記録');
    // 次のシャッフルでは、読んだ人物の全発言を候補の後ろへ回す。
    spotlightPool.filter(note => note.person_id === r.person_id)
      .forEach(note => { note.last_reviewed_at = now; });
    btn.textContent = '記録しました';
    status.textContent = '次の振り返りに反映されます';
  }catch(e){
    btn.disabled = false;
    btn.textContent = '読んだ';
    status.textContent = e._uncertain ? '記録を確認できませんでした。次の表示で確認してください。' : '記録できませんでした。もう一度お試しください。';
    console.error('last_reviewed_at更新失敗', e);
  }
}

$('#btn-cleanup').onclick = async ()=>{

  const btn = $('#btn-cleanup'); btn.disabled = true;
  const res = $('#cleanup-result'); res.classList.remove('err'); res.classList.add('show');
  res.textContent = '整形中…';
  const uid = currentUid;

  try{
    const notes = await selectAll(()=>supa.from('exp_notes').select('id,person_id,text').order('id'), '発言の取得');
    const byPerson = {};
    notes.forEach(n => { (byPerson[n.person_id] = byPerson[n.person_id] || []).push(n); });

    let done = 0, failed = 0, skipped = 0;
    const total = notes.length;
    for(const pid of Object.keys(byPerson)){
      // 途中でログアウト・アカウント切替があったら、前の利用者の発言をAIへ送り続けない
      if(uid !== currentUid) return;
      const group = byPerson[pid];
      let handled = 0;
      try{
        const parsed = await geminiJson(buildCleanupPrompt(group.map(n=>n.text)), CLEANUP_SCHEMA);
        if(uid !== currentUid) return;
        const arr = parsed.statements || [];
        // AIが件数を変えて返すと、i番目の文が別の発言に入れ替わってしまうため、その人の分は丸ごと見送る
        if(arr.length !== group.length) throw new Error('整形後の件数が元と合いません');
        // AIの返事を待つ間に手直し・削除された発言を、古い文の整形結果で上書きしないよう取り直す
        const latest = await dbRetry(()=>supa.from('exp_notes').select('id,text').eq('person_id', group[0].person_id), '発言の再確認');
        const latestText = new Map(latest.map(n => [String(n.id), n.text]));
        for(let i=0;i<group.length;i++){
          if(latestText.get(String(group[i].id)) !== group[i].text){ skipped++; handled++; continue; }
          const nv = norm(arr[i]);
          if(nv && nv !== group[i].text){
            await dbRetry(()=>supa.from('exp_notes').update({text:nv, text_before_cleanup:group[i].text}).eq('id',group[i].id), '発言の更新');
          }
          done++; handled++;
        }
      }catch(e){
        // 途中まで書き込めた分は数え済みなので、残りだけを失敗に数える
        failed += group.length - handled;
      }
      res.textContent = `整形中…（${done+failed+skipped}/${total}）`;
    }
    if(uid !== currentUid) return;
    const extra = [failed && `${failed}件は失敗`, skipped && `${skipped}件は整形中に変更されたため見送り`].filter(Boolean);
    res.textContent = `完了：${done}件を整形しました` + (extra.length ? `（${extra.join('、')}）` : '');
    res.classList.toggle('err', done===0 && failed>0);
    people = [];
    refreshSpotlight();
  }catch(e){
    if(uid !== currentUid) return;
    res.textContent = '失敗しました：'+e.message; res.classList.add('err');
  }finally{
    btn.disabled = false;
  }
};

/* ---------- ログイン ---------- */
const authScreen = $('#auth');
function authMsg(m, ok){ const el=$('#au-msg'); el.textContent=m; el.classList.toggle('ok', !!ok); }

// ログイン状態の変化（onAuthStateChange）と起動時の確認（getSession）の両方から呼ぶ
function applySession(session){
  if(session && session.user){
    const changed = currentUid !== session.user.id;
    if(currentUid && currentUid !== session.user.id) clearUserScopedState();
    currentUid = session.user.id;
    accountEmail = session.user.email || 'メールアドレス不明';
    if(changed){ showAccountSummary('確認中…'); refreshAccountCount(); }
    localStorage.setItem('last_email', session.user.email||'');
    // ログイン後はパスワードを入力欄に残さない（ログアウトした画面に残り、他の人がそのまま入れてしまうため）
    $('#au-pass').value = '';
    authScreen.classList.add('hide');
    $('#who').textContent = 'ログイン中：'+(session.user.email||'');
    if(!spotlightLoaded) loadSpotlight();
  }else{
    clearUserScopedState();
    currentUid = null;
    authScreen.classList.remove('hide');
  }
}
supa.auth.onAuthStateChange((_e, session)=> applySession(session));
supa.auth.getSession().then(({ data }) => applySession(data.session));

$('#au-form').onsubmit = async (ev)=>{
  ev.preventDefault();
  authMsg('');
  const email=$('#au-email').value.trim(), pass=$('#au-pass').value;
  if(!email||!pass){ authMsg('メールとパスワードを入れてください'); return; }
  $('#au-login').disabled=true;
  const { error } = await supa.auth.signInWithPassword({ email, password: pass });
  $('#au-login').disabled=false;
  if(error) authMsg('ログインできませんでした：'+error.message);
};
$('#au-signup').onclick = async ()=>{
  authMsg('');
  const email=$('#au-email').value.trim(), pass=$('#au-pass').value;
  if(!email||!pass){ authMsg('メールとパスワードを入れてください'); return; }
  if(pass.length<6){ authMsg('パスワードは6文字以上にしてください'); return; }
  const { data, error } = await supa.auth.signUp({ email, password: pass });
  if(error){ authMsg('登録できませんでした：'+error.message); return; }
  if(data.session) authMsg('登録してログインしました。', true);
  else authMsg('確認メールを送りました。リンクを押したあと、同じメール・パスワードで「ログイン」してください。', true);
};
$('#btn-logout').onclick = async ()=>{ await supa.auth.signOut(); };
} catch (error) {
  console.error('アプリの起動に失敗しました', error);
  document.querySelector('#au-msg').textContent = 'アプリを起動できませんでした。通信状態を確認し、ページを再読み込みしてください。';
  document.querySelector('#au-login').disabled = true;
  document.querySelector('#au-signup').disabled = true;
  const retry = document.createElement('button');
  retry.type = 'button';
  retry.textContent = 'ページを再読み込み';
  retry.className = 'primary secondary';
  retry.onclick = () => location.reload();
  document.querySelector('#au-msg').after(retry);
}
</script>
